services:

  api:
    build: .
    container_name: hotel-api

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      mongo:
        condition: service_started

      redis:
        condition: service_started

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hotel_booking
      DB_USER: postgres
      DB_PASSWORD: postgres

      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: hotel_booking

      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - .:/app

  postgres:
    image: postgres:16
    container_name: hotel-db

    restart: always

    environment:
      POSTGRES_DB: hotel_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02_data.sql

  mongo:
    image: mongo:7
    container_name: hotel-mongo

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - ./mongo/validation.js:/docker-entrypoint-initdb.d/01_validation.js
      - ./mongo/data.js:/docker-entrypoint-initdb.d/02_data.js

  redis:
    image: redis:7
    container_name: hotel-redis

    restart: always

    ports:
      - "6379:6379"